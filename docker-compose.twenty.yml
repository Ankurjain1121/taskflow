networks:
  twenty-network:
    driver: bridge
    # NOTE: taskbolt-network not present at deploy time; join Twenty to taskbolt-network
    # manually once TaskBolt is deployed: `docker network connect taskbolt-network twenty-server`

volumes:
  twenty-pg-data:
  twenty-redis-data:
  twenty-server-files:

services:
  twenty-postgres:
    image: postgres:16
    container_name: twenty-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_DATABASE_USER:-twenty}
      POSTGRES_PASSWORD: ${PG_DATABASE_PASSWORD:?PG_DATABASE_PASSWORD required}
      POSTGRES_DB: ${PG_DATABASE_NAME:-default}
    volumes:
      - twenty-pg-data:/var/lib/postgresql/data
    networks:
      - twenty-network
    mem_limit: 1024M
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_DATABASE_USER:-twenty} -d ${PG_DATABASE_NAME:-default}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  twenty-redis:
    image: redis:7-alpine
    container_name: twenty-redis
    restart: unless-stopped
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--maxmemory", "1gb"]
    volumes:
      - twenty-redis-data:/data
    networks:
      - twenty-network
    mem_limit: 1024M
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  twenty-server:
    image: twentycrm/twenty:${TAG:-v2.2.0}
    container_name: twenty-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      SERVER_URL: ${SERVER_URL:-https://crm.taskflow.paraslace.in}
      PORT: 3000
      APP_SECRET: ${APP_SECRET:?APP_SECRET required}
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-twenty}:${PG_DATABASE_PASSWORD}@${PG_DATABASE_HOST:-twenty-postgres}:5432/${PG_DATABASE_NAME:-default}
      DATABASE_URL: postgres://${PG_DATABASE_USER:-twenty}:${PG_DATABASE_PASSWORD}@${PG_DATABASE_HOST:-twenty-postgres}:5432/${PG_DATABASE_NAME:-default}
      REDIS_URL: ${REDIS_URL:-redis://twenty-redis:6379}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_PATH: /app/files
      DISABLE_DB_MIGRATIONS: ${DISABLE_DB_MIGRATIONS:-false}
      DISABLE_CRON_JOBS_REGISTRATION: ${DISABLE_CRON_JOBS_REGISTRATION:-false}
    volumes:
      - twenty-server-files:/app/files
    networks:
      - twenty-network
    mem_limit: 2048M
    cpus: 1.5
    depends_on:
      twenty-postgres:
        condition: service_healthy
      twenty-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/healthz || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 360s

  twenty-worker:
    image: twentycrm/twenty:${TAG:-v2.2.0}
    container_name: twenty-worker
    restart: unless-stopped
    command: ["yarn", "worker:prod"]
    environment:
      NODE_ENV: production
      APP_SECRET: ${APP_SECRET:?APP_SECRET required}
      PG_DATABASE_URL: postgres://${PG_DATABASE_USER:-twenty}:${PG_DATABASE_PASSWORD}@${PG_DATABASE_HOST:-twenty-postgres}:5432/${PG_DATABASE_NAME:-default}
      DATABASE_URL: postgres://${PG_DATABASE_USER:-twenty}:${PG_DATABASE_PASSWORD}@${PG_DATABASE_HOST:-twenty-postgres}:5432/${PG_DATABASE_NAME:-default}
      REDIS_URL: ${REDIS_URL:-redis://twenty-redis:6379}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_PATH: /app/files
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: ${DISABLE_CRON_JOBS_REGISTRATION:-false}
    volumes:
      - twenty-server-files:/app/files
    networks:
      - twenty-network
    mem_limit: 1024M
    cpus: 1.0
    depends_on:
      twenty-postgres:
        condition: service_healthy
      twenty-redis:
        condition: service_healthy
      twenty-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
